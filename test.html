<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⋆.˚ ☼⋆𓇼｡𖦹˙༄.° </title>
    <style>
        :root { 
            --bg-color: #fafafa; 
            --text-color: #1a4a75; 
            --entry-bg: #ffffff;
            --accent: #5dade2;
            --menu-bg: rgba(255, 255, 255, 0.9);
            --border-subtle: rgba(128,128,128,0.08);
        }

        body.dark-mode { 
            --bg-color: #0b0f19; 
            --text-color: #94e2d5; 
            --entry-bg: #161b22;
            --menu-bg: rgba(22, 27, 34, 0.95);
            --border-subtle: rgba(148, 226, 213, 0.1);
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0;
            color: var(--text-color);
            transition: background-color 1.2s ease, color 1.2s ease;
            overflow-x: hidden;
        } 
        
        #theme-toggle {
            position: fixed; top: 25px; left: 35px; z-index: 3000;
            background: transparent; border: 1px solid var(--text-color);
            color: var(--text-color); padding: 5px 15px; border-radius: 50px;
            cursor: pointer; font-size: 0.9rem; transition: all 0.4s ease;
        }

        .menu-container {
            position: fixed; top: 25px; right: 35px; z-index: 3000;
            text-align: right;
        }
        .menu-arrow { font-size: 1.5rem; cursor: pointer; opacity: 0.4; display: inline-block; transform: rotate(90deg); color: var(--text-color); }
        .menu-content {
            display: none; background: var(--menu-bg); 
            backdrop-filter: blur(12px); border-radius: 12px; padding: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); border: 1px solid rgba(128,128,128,0.2);
        }
        .menu-container:hover .menu-content { display: block; animation: fadeIn 0.3s ease; }
        .menu-content button {
            display: block; width: 100%; background: none; border: none;
            padding: 10px 20px; text-align: right; cursor: pointer;
            font-size: 0.8rem; letter-spacing: 2px; color: var(--text-color);
            transition: 0.3s ease;
        }
        .menu-content button:hover { color: var(--accent); transform: translateX(-5px); }

        header { padding: 12vh 0 6vh; text-align: center; }
        
        /* ===== TÍTULO CON FLOTACIÓN SUTIL ===== */
        h1 { 
            font-weight: 700; 
            letter-spacing: 12px; 
            text-transform: uppercase; 
            font-size: 1.4rem; 
            opacity: 0.8; 
            margin: 0;
            transition: all 0.3s ease;
            display: inline-block;
            transform-origin: center;
            animation: subtleFloat 5s infinite ease-in-out;
            cursor: default;
        }
        
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        
        /* ===== GLITCH SUTIL DEL TÍTULO (como suspiro) ===== */
        h1:hover {
            animation: softRipple 0.3s ease-in-out;
            text-shadow: 1px 0 rgba(90, 160, 220, 0.3), -1px 0 rgba(220, 90, 160, 0.3);
            letter-spacing: 13px;
            transform: scale(1.01);
        }
        
        @keyframes softRipple {
            0% { transform: translateX(0px) scale(1); letter-spacing: 12px; }
            25% { transform: translateX(1px) scale(1.005); letter-spacing: 13px; }
            75% { transform: translateX(-1px) scale(1.005); letter-spacing: 13px; }
            100% { transform: translateX(0px) scale(1); letter-spacing: 12px; }
        }

        /* ===== MASONRY (PINTEREST STYLE) ===== */
        #feed { 
            column-count: 4;
            column-gap: 20px;
            padding: 20px;
            max-width: 95vw;
            margin: 0 auto;
        }

        @media (max-width: 1200px) { #feed { column-count: 3; } }
        @media (max-width: 850px) { #feed { column-count: 2; } }
        @media (max-width: 550px) { #feed { column-count: 1; } }

        /* ===== ENTRADAS ===== */
        .entry { 
            break-inside: avoid;
            margin-bottom: 20px;
            background: var(--entry-bg); 
            padding: 20px; 
            border: 1px solid var(--border-subtle);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: inline-block;
            width: 100%;
            position: relative;
            backdrop-filter: blur(2px);
            
            /* Rotación sutil */
            transform: rotate(var(--rot, 0deg)) translateY(var(--y-offset, 0px));
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* Rotaciones más suaves */
        .entry:nth-child(odd) { --rot: -0.3deg; --y-offset: 1px; }
        .entry:nth-child(even) { --rot: 0.2deg; --y-offset: -0.5px; }
        .entry:nth-child(3n) { --rot: 0.4deg; --y-offset: 1px; }
        .entry:nth-child(5n) { --rot: -0.4deg; --y-offset: -0.8px; }
        .entry:nth-child(7n) { --rot: 0.1deg; --y-offset: 0.3px; }

        /* Flotación muy sutil */
        .entry {
            animation: gentleFloat 7s infinite ease-in-out;
            animation-delay: calc(var(--order, 0) * 0.06s);
        }
        
        @keyframes gentleFloat {
            0%, 100% { transform: rotate(var(--rot, 0deg)) translateY(var(--y-offset, 0px)); }
            50% { transform: rotate(calc(var(--rot, 0deg) + 0.2deg)) translateY(calc(var(--y-offset, 0px) - 2px)); }
        }

        .entry:hover { 
            transform: translateY(-4px) scale(1.01) rotate(calc(var(--rot, 0deg) - 0.1deg));
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.08);
            z-index: 100; 
            border-color: var(--accent);
        }

        /* ===== GLITCH EN TEXTO (como agua) ===== */
        .entry:hover .content {
            text-shadow: 1px 0 rgba(90, 160, 220, 0.4), -1px 0 rgba(220, 90, 160, 0.4);
            letter-spacing: 0.8px;
            transition: 0.08s linear;
        }

        .content { 
            font-family: 'Courier New', monospace; 
            font-size: 1rem; 
            line-height: 1.6; 
            transition: 0.2s ease;
            word-break: break-word;
        }
        
        .date { 
            font-size: 0.65rem; 
            opacity: 0.4; 
            text-align: right; 
            margin-top: 12px; 
            font-family: 'Courier New', monospace; 
        }
        
        .entry img { 
            width: calc(100% + 40px); 
            margin-left: -20px; 
            margin-top: 10px; 
            margin-bottom: -6px;
            filter: saturate(0.75) contrast(0.97);
            transition: 0.5s ease;
            opacity: 0.92;
            display: block;
        }
        
        .entry:hover img { 
            filter: saturate(1.02) contrast(1.01);
            opacity: 1;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button id="theme-toggle" onclick="toggleDarkMode()">⋅˚.⋆☾⁺₊ ‧</button>

    <div class="menu-container">
        <div class="menu-arrow">➤</div>
        <div class="menu-content">
            <button onclick="filter('all')">VER TODO</button>
            <button onclick="filter('referencias')">REFERENCIAS</button>
            <button onclick="filter('pruebas-material')">MATERIAL</button>
            <button onclick="filter('bitacora-diaria')">DIARIA</button>
            <button onclick="filter('la-vida')">LA VIDA</button>
        </div>
    </div>

    <header>
        <h1>✧･ﾟ: * [ L A T T I C E _ O S 1 ] *:･ﾟ✧</h1>
    </header>

    <main id="feed">
        <p style="text-align: center; opacity: 0.5;">Iniciando sistema...</p>
    </main>

<script>
    let audioCtx;
    let isMusicPlaying = false;
    const notes = [216, 256.8, 324, 384, 432]; 

    function playPop() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
        g.gain.setValueAtTime(0.01, audioCtx.currentTime);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function playDreamMusic() {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(isMusicPlaying) return;
        isMusicPlaying = true;
        setInterval(() => {
            if(!document.body.classList.contains('dark-mode')) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            const freq = notes[Math.floor(Math.random() * notes.length)];
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(0, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0.007, audioCtx.currentTime + 3); 
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 7);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 8);
        }, 8000);
    }

    function toggleDarkMode() {
        playPop();
        document.body.classList.toggle('dark-mode');
        if(document.body.classList.contains('dark-mode')) {
            playDreamMusic();
        }
    }

    function filter(cat) {
        playPop();
        const entries = document.querySelectorAll('.entry');
        entries.forEach(entry => {
            const category = entry.getAttribute('data-category') || '';
            entry.style.display = (cat === 'all' || category.includes(cat)) ? 'block' : 'none';
        });
    }

    async function loadBitacora() {
        const feed = document.getElementById('feed');
        try {
            const response = await fetch('/api/get-lattice');
            const records = await response.json();
            if (feed) feed.innerHTML = ''; 

            records.forEach((record, index) => {
                const f = record.fields;
                const msg = f.mensaje || '';
                const canal = (f.canal || 'S/N').toLowerCase();
                const rawFecha = f["fecha y hora"];
                
                let foto = '';
                if (f.archivo && f.archivo[0]) {
                    foto = f.archivo[0].thumbnails?.large?.url || f.archivo[0].url;
                }

                if (!msg && !foto) return;

                const entry = document.createElement('article');
                entry.className = 'entry';
                entry.setAttribute('data-category', canal);
                entry.style.setProperty('--order', index);
                
                const imgHtml = foto ? `<img src="${foto}" loading="lazy" onerror="this.style.display='none'">` : '';
                
                let fechaDisplay = '---';
                if (rawFecha) {
                    const d = new Date(rawFecha);
                    fechaDisplay = isNaN(d) ? '---' : d.toLocaleDateString('es-CL').toUpperCase();
                }

                entry.innerHTML = `
                    <div class="content">${msg.replace(/\n/g, '<br>')}</div>
                    ${imgHtml}
                    <span class="date">${fechaDisplay} | CH_${canal.toUpperCase()}</span>
                `;
                feed.appendChild(entry);
            });
        } catch (e) {
            console.error(e);
            feed.innerHTML = '<p style="text-align:center">Interferencia en la señal.</p>';
        }
    }
    window.onload = loadBitacora;
</script>
</body>
</html>
